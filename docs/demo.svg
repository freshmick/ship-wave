<text x="62.4" y="170" class="plain" opacity="0">a) admins only, or b) admins and support<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.1067;0.3167;1" dur="30s" repeatCount="indefinite"/></text>
