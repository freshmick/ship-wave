<text x="45.2" y="98" class="dim" opacity="0">Read the spec and the code. One thing only you can settle:<animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.0667;0.3167;1" dur="30s" repeatCount="indefinite"/></text>
